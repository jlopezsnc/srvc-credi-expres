# Perfil de GKE. Sin secretos aquí: la contraseña llega de Secret Manager montada como archivo
# en /etc/secrets/db-password; el resto, del ConfigMap (k8s/configmap.yaml).
spring.config.import=optional:configtree:/etc/secrets/

# El sidecar Cloud SQL Auth Proxy escucha en 127.0.0.1:3306 dentro del pod.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${db-password}

spring.jpa.show-sql=false
# Detrás del balanceador de Google: respetar X-Forwarded-Proto/Host.
server.forward-headers-strategy=framework
server.shutdown=graceful
