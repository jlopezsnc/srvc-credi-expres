# Perfil de desarrollo local. Los valores sensibles (DB_PASSWORD, FIREBASE_PROJECT_ID) se leen de
# variables de entorno o de config/application-local.properties (ignorado por git).
spring.config.import=optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prestamos}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
