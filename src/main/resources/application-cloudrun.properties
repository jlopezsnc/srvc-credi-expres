# Perfil de Cloud Run (docs/DESPLIEGUE-GCP.md). Sin secretos aquí: la contraseña llega de Secret
# Manager montada como archivo en /etc/secrets/db-password; el resto, de variables de entorno que
# pone deploy/deploy-back.ps1.
spring.config.import=optional:configtree:/etc/secrets/

# MySQL en la VM e2-micro, por IP interna (Direct VPC egress). sslMode=REQUIRED: el tráfico va
# cifrado aunque no salga de la red privada (la VM rechaza conexiones sin TLS).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${db-password}

# Pocas conexiones: a lo más 2 instancias x 4 = 8, y la VM tiene 1 GB de RAM. Con minimum-idle=0
# el pool suelta las conexiones cuando no hay uso, y la instancia puede apagarse sin dejarlas abiertas.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000

spring.jpa.show-sql=false

# Cloud Run expone un solo puerto (variable PORT): el health va en el mismo, en /api/actuator/health.
server.port=${PORT:8080}
management.server.port=${PORT:8080}

# Detrás de Firebase Hosting y del front de Google: respetar X-Forwarded-Proto/Host.
server.forward-headers-strategy=framework
# Cloud Run da 10 s entre SIGTERM y SIGKILL.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
