spring.application.name=backEndServices-credi-express
# Sin perfil explícito se usa dev. En GKE: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# El Ingress de GKE (y el proxy de Vite en local) envía /api/* a este servicio.
server.servlet.context-path=/api
server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=update  # O create, create-drop, validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
logging.level.root=INFO

spring.jackson.date-format:"yyyy-MM-dd"
spring.jackson.time-zone=America/Mexico_City

# Seguridad: valida el ID token de Firebase (firma, emisor, audiencia y expiración).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${FIREBASE_PROJECT_ID}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
spring.security.oauth2.resourceserver.jwt.audiences=${FIREBASE_PROJECT_ID}

# Actuator en un puerto interno: no pasa por el Ingress, solo lo usan las probes de Kubernetes.
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
