spring.application.name=backEndServices-credi-express
# Sin perfil explícito se usa dev. En Cloud Run: SPRING_PROFILES_ACTIVE=cloudrun
spring.profiles.default=dev

# Firebase Hosting (y el proxy de desarrollo en local) envía /api/* a este servicio.
server.servlet.context-path=/api
server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# El esquema lo maneja Flyway (src/main/resources/db/migration), nunca Hibernate.
# Hibernate 6 detecta el dialecto de MySQL solo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway: en una base que ya tiene tablas pero no historial, la marca como V1 (línea base) y
# aplica desde V2. En una base vacía ejecuta todo desde V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
logging.level.root=INFO

# Las fechas son LocalDate y salen como "yyyy-MM-dd" (Jackson JavaTimeModule).
spring.jackson.time-zone=America/Mexico_City

# Seguridad: valida el ID token de Firebase (firma, emisor, audiencia y expiración).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${FIREBASE_PROJECT_ID}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
spring.security.oauth2.resourceserver.jwt.audiences=${FIREBASE_PROJECT_ID}
# Lista blanca: UIDs de Firebase de los usuarios del negocio, separados por coma. Vacía = nadie entra.
# En local va en config/application-local.properties; en Cloud Run la pone deploy/deploy-back.ps1.
seguridad.usuarios-permitidos=${USUARIOS_PERMITIDOS:}
# Tiempo máximo desde que se inició sesión con contraseña (claim auth_time). Igual que el front.
seguridad.sesion-maxima=12h

# Actuator en un puerto aparte en local; en Cloud Run va en el mismo puerto (application-cloudrun).
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
