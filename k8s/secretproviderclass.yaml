# Add-on de Secret Manager para GKE: monta el secreto como archivo /etc/secrets/db-password.
# No se crea ningún Secret de Kubernetes (que solo estaría en base64).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: crediexpress-back-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/__PROYECTO_GCP__/secrets/db-password/versions/latest"
        path: "db-password"
