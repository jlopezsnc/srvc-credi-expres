# Entrada: solo el balanceador y los health checks de Google.
# Salida: solo DNS, metadata server (Workload Identity), APIs de Google (443) y Cloud SQL (3307).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crediexpress-back
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: crediexpress-back
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    # Validación de tokens de Firebase y API de Cloud SQL Admin.
    - ports:
        - protocol: TCP
          port: 443
    # Cloud SQL (IP privada) a través del Auth Proxy.
    - ports:
        - protocol: TCP
          port: 3307
