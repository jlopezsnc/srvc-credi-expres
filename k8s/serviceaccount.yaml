# Identidad del pod. Workload Identity la enlaza con la cuenta de servicio de GCP
# crediexpress-back (permisos mínimos: Cloud SQL Client y lectura de un solo secreto). Sin llaves JSON.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crediexpress-back
  labels:
    app.kubernetes.io/name: crediexpress-back
    app.kubernetes.io/part-of: crediexpress
  annotations:
    iam.gke.io/gcp-service-account: crediexpress-back@__PROYECTO_GCP__.iam.gserviceaccount.com
